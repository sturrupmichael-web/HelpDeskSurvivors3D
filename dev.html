<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Helpdesk Survivors 3D</title>
  <meta name="description" content="Survive a 20-minute shift on the IT helpdesk, now in 3D. A free survivors-like you play in the browser, on a computer or a phone.">
  <meta property="og:title" content="Helpdesk Survivors 3D">
  <meta property="og:description" content="Survive a 20-minute shift on the IT helpdesk, now in 3D.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://michaelsturrup.com/HelpDeskSurvivors3D/">
  <meta property="og:image" content="https://michaelsturrup.com/HelpDeskSurvivors3D/icons/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1c2c">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Helpdesk 3D">
  <link rel="stylesheet" href="src/ui/style.css">
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot">Loading…</div>
  <script>
    // Shows load errors on the page instead of a blank screen (main.js removes #boot once running).
    addEventListener('error', (e) => {
      const b = document.getElementById('boot');
      if (b) b.textContent = 'The game failed to load: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown error');
    }, true);
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
